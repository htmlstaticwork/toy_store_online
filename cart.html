<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — ToyWorld</title>
  <meta name="description" content="Review your cart items, apply coupon codes, and proceed to secure checkout at ToyWorld.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/rtl.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="has-header">
  <header class="header"><div class="header-inner"><a href="index.html" class="header-logo"><img src="assets/images/logo.png" alt="ToyWorld Logo"><span>ToyWorld</span></a><nav class="nav-desktop"><a href="index.html" class="nav-link">Home</a><a href="home2.html" class="nav-link">Home 2</a><a href="shop.html" class="nav-link">Shop</a><a href="categories.html" class="nav-link">Categories</a><a href="about.html" class="nav-link">About</a><a href="contact.html" class="nav-link">Contact</a><a href="dashboard.html" class="nav-link">Dashboard</a></nav><div class="header-actions"><div class="header-cta"><a href="shop.html" class="btn btn-primary btn-sm">Shop Now</a><a href="signup.html" class="btn btn-secondary btn-sm">Sign Up</a></div><button class="theme-toggle" title="Toggle Dark Mode"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button><button class="rtl-toggle" title="Toggle RTL">RTL</button><a href="cart.html" class="cart-btn" title="Cart"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cart-count" style="display:none">0</span></a><button class="nav-mobile-toggle" aria-label="Toggle menu"><div class="hamburger"><span></span><span></span><span></span></div></button></div></div></header>
  <nav class="nav-mobile"><a href="index.html" class="nav-link">Home</a><a href="home2.html" class="nav-link">Home 2</a><a href="shop.html" class="nav-link">Shop</a><a href="categories.html" class="nav-link">Categories</a><a href="about.html" class="nav-link">About</a><a href="contact.html" class="nav-link">Contact</a><a href="dashboard.html" class="nav-link">Dashboard</a><a href="shop.html" class="btn btn-primary">Shop Now</a><a href="signup.html" class="btn btn-secondary">Sign Up</a>
    <div class="nav-mobile-actions">
      <button class="theme-toggle" title="Toggle Dark Mode" aria-label="Toggle dark mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="rtl-toggle" title="Toggle RTL" aria-label="Toggle RTL direction">RTL</button>
      <a href="cart.html" class="cart-btn" title="Cart" aria-label="Shopping cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" style="display:none">0</span>
      </a>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <span class="section-badge">🛒 Your Cart</span>
      <h1>Shopping Cart</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="cart-layout">
        <!-- Cart Items -->
        <div class="cart-items" id="cart-items">
          <!-- Rendered by JS -->
        </div>

        <!-- Order Summary -->
        <div class="order-summary" id="order-summary-content">
          <h3>Order Summary</h3>

          <div class="coupon-input">
            <input type="text" class="form-input" placeholder="Coupon code" id="coupon-input">
            <button class="btn btn-secondary btn-sm" onclick="CartManager.showToast('Coupon applied!')">Apply</button>
          </div>

          <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">$0.00</span></div>
          <div class="summary-row"><span>Shipping</span><span id="summary-shipping">$0.00</span></div>
          <div class="summary-row"><span>Tax (8%)</span><span id="summary-tax">$0.00</span></div>
          <div class="summary-row total"><span>Total</span><span id="summary-total">$0.00</span></div>

          <h5 style="margin: var(--space-6) 0 var(--space-3); font-size: var(--text-sm);">Shipping Options</h5>
          <div class="shipping-options">
            <label class="shipping-option active">
              <input type="radio" name="shipping" checked>
              <span>Standard (3-5 days)</span>
              <span class="shipping-price">Free</span>
            </label>
            <label class="shipping-option">
              <input type="radio" name="shipping">
              <span>Express (1-2 days)</span>
              <span class="shipping-price">$9.99</span>
            </label>
          </div>

          <button class="btn btn-primary w-full" onclick="CartManager.showToast('Proceeding to payment...')">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Secure Checkout
          </button>

          <div class="payment-badges">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span style="font-size: 11px; color: var(--text-tertiary);">Secure Payment</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-bottom: var(--space-20);"></section>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
